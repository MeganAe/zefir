name: zefir
description: "Zefir - Compression vidéo locale haute performance, Material 3 Expressive."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  open_filex: ^4.5.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
