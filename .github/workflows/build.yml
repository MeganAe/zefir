name: Build & Release Zefir

# Déclenchement 100% manuel via l'interface GitHub Actions (bouton "Run workflow")
on:
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Analyse & Tests
  # =========================================================================
  quality-check:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  # =========================================================================
  # 2. Build Android (Signed APK & AAB)
  # =========================================================================
  build-android:
    name: Build Signed Android APK & AAB
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ephemeral release keystore
        run: |
          keytool -genkeypair -v \
            -keystore zefir-upload.jks \
            -storetype JKS \
            -alias zefir \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zefir-ci-keystore -keypass zefir-ci-key \
            -dname "CN=Zefir, OU=Mobile, O=Metoushael, C=FR"

      - name: Write key.properties
        run: |
          cat > key.properties <<EOF
          storeFile=../../zefir-upload.jks
          storePassword=zefir-ci-keystore
          keyAlias=zefir
          keyPassword=zefir-ci-key
          EOF

      - name: Build signed APK (Release)
        run: flutter build apk --release

      - name: Build signed App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zefir-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zefir-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # =========================================================================
  # 3. Build Windows (.exe) & Package avec Inno Setup
  # =========================================================================
  build-windows:
    name: Build Windows Release & Create Inno Setup Installer
    needs: quality-check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable Windows Desktop support
        run: flutter config --enable-windows-desktop

      - name: Build Windows Application (Release)
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Compile Installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" windows/installer/zefir_setup.iss

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: zefir-windows-installer
          path: build/windows/installer/Zefir-Setup-x64.exe
